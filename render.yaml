# Render Blueprint — https://render.com/docs/blueprint-spec
#
# The service is a Web Service, not a Static Site, because that is what was
# asked for. It still serves the plain static export required by spec §12.2:
# `npm run build` writes HTML to dist/, and server.mjs serves those files.
#
# Committing this file means the service is reproducible: a new Render account
# can point at this repo and get an identical deployment with no console
# clicking, and any change to the build or start command is reviewed in git.
services:
  - type: web
    name: kpomey
    runtime: node
    # Closest Render region to Abuja — §10.3 treats latency as a design
    # constraint, and Frankfurt is ~2 hops from West African peering.
    region: frankfurt
    # Free spins the service down after 15 minutes without traffic, and the
    # next visitor waits ~1 minute for it to wake. Change to `starter` ($7/mo)
    # to keep it warm — the only edit needed, and it takes effect on push.
    plan: free
    branch: main
    autoDeploy: true

    # `npm install`, not `npm ci`.
    #
    # `npm ci` refuses to run unless package.json and package-lock.json agree,
    # and a lockfile generated on Windows cannot satisfy it on Linux. sharp
    # pulls in optional wasm32 packages whose *peer* dependencies (@emnapi/core,
    # @emnapi/runtime) npm prunes from the tree on Windows and expects on Linux.
    # `npm install --package-lock-only` cannot fix this from a Windows machine:
    # it reproduces the same pruning. See docs/DEPLOY.md.
    #
    # `npm install` still honours every version the lockfile pins — it resolves
    # only what is missing — so the drift is limited to that wasm branch, which
    # is never loaded on Linux x64 anyway.
    #
    # --include=dev is explicit because Render sets NODE_ENV=production, which
    # would otherwise skip the build-time typescript and @astrojs/check.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.mjs

    # `/` is a real page, so a failed build that produced no dist/ fails the
    # health check instead of going live empty.
    healthCheckPath: /

    envVars:
      # Must match .node-version. Kept here too so the blueprint is
      # self-describing for anyone reading only this file.
      - key: NODE_VERSION
        value: 22.21.0
      # Absolute URL used for <link rel="canonical"> and og:url at build time.
      # Set this in the Render dashboard to the live origin — the .onrender.com
      # URL until the custom domain is attached, then https://kpomey.com.
      # `sync: false` means Render prompts rather than committing the value.
      - key: PUBLIC_SITE_URL
        sync: false
